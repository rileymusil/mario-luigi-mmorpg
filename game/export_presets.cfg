[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/maps/*.json,data/*.json"
exclude_filter=""
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">
<meta name=\"theme-color\" content=\"#000000\">
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; background: #000; }
#canvas { display: block; width: 100%; height: 100%; }
</style>
<script>
// iOS ignores user-scalable=no: stop pinch zoom and double-tap zoom by hand.
document.addEventListener(\"gesturestart\", function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener(\"dblclick\", function (e) { e.preventDefault(); }, { passive: false });
// Full screen (the button in the touch controls) also turns the game sideways on Android.
document.addEventListener(\"fullscreenchange\", function () {
	if (document.fullscreenElement && screen.orientation && screen.orientation.lock) {
		screen.orientation.lock(\"landscape\").catch(function () {});
	}
});
</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
